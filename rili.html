<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分红日历 — 攒股收息</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <style>
    html{color-scheme:light}
    footer a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
    footer a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold)}
    body{background:#f8f9fb;color:#1a1d29}
    .rili-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .rili-head h2{margin:0;font-size:20px}
    .rili-head span{font-size:12.5px;color:var(--text-muted)}
    .cal-row{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:9px;
      background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);
      box-shadow:var(--shadow-sm);transition:var(--transition)}
    .cal-row:hover{background:var(--bg-card-hover)}
    .cal-row.soon{border-left:3px solid var(--accent-gold)}
    .cal-date{width:96px;flex:none;font-variant-numeric:tabular-nums;line-height:1.35}
    .cal-date b{display:block;font-size:15px}
    .cal-date small{font-size:11.5px;color:var(--text-muted)}
    .cal-name{flex:1;font-size:14px;line-height:1.5}
    .cal-name small{display:block;font-size:11.5px;color:var(--text-muted)}
    .cal-amt{text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
    .cal-amt b{font-size:16px;color:var(--accent-gold)}
    .cal-amt small{display:block;font-size:11px;color:var(--text-muted)}
    .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;margin-left:6px;
      background:rgba(128,128,128,.16);color:var(--text-muted)}
    .tag.est{background:rgba(212,160,10,.14);color:#8a6200}
    .rili-note{font-size:12px;color:var(--text-muted);line-height:1.9;margin-top:14px}
    .rili-empty{padding:34px;text-align:center;color:var(--text-muted);font-size:13.5px}
    .cal-row.recv{background:var(--bg-card-hover);border-left:3px solid var(--border-light)}
    .cal-row.recv .cal-amt b{color:var(--text-primary)}
    /* M-2026 */

    @media (max-width:560px){
      .rili-head h2{font-size:17px}
      .cal-row{flex-wrap:wrap;gap:6px 10px;padding:12px 14px}
      .cal-date{width:auto;display:flex;align-items:baseline;gap:7px}
      .cal-date b{display:inline;font-size:14px}
      .cal-date small{font-size:11px}
      .cal-name{flex:1 1 100%;order:2;font-size:13px}
      .cal-name small{font-size:11px}
      .cal-amt{order:3;margin-left:auto;text-align:right}
      .cal-amt b{font-size:15px}
    }
    @media (max-width:400px){
      .cal-row{padding:11px 12px}
      .cal-amt b{font-size:14px}
    }

  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-chart-line"></i> 攒股收息
    </div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="菜单">
      <i class="fas fa-bars"></i>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> 仪表板</a></li>
      <li><a href="chicang.html"><i class="fas fa-chart-pie"></i> 持仓分析</a></li>
      <li><a href="chufa.html"><i class="fas fa-bell"></i> 触发价</a></li>
      <li><a href="funds.html"><i class="fas fa-layer-group"></i> 场外基金</a></li>
      <li><a href="rili.html"><i class="fas fa-calendar-check"></i> 分红日历</a></li>
      <li><a href="profile.html"><i class="fas fa-user"></i> 个人中心</a></li>
    </ul>
    <div class="user-info">
      <span id="username"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="退出登录">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="rili-head">
      <h2><i class="fas fa-calendar-check"></i> 分红日历</h2>
      <span id="asof"></span>
    </div>
    <div id="list"></div>

    <div class="rili-head" style="margin-top:30px;">
      <h2><i class="fas fa-coins"></i> 已收分红</h2>
      <span id="recvsum"></span>
    </div>
    <div id="received"></div>

    <div class="rili-note">
      除权日与派息额来自东方财富「实施分配」记录。<br>
      标注「按历史间隔推算」的<b>不是公告值</b>，实际日期与金额可能差几天，仅作参考。<br>
      金额为税前估算，实际到账会少 10%–20%（持股满 1 年免扣）。
    </div>
  </div>

  <footer style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">
    <div style="margin-bottom:10px;">本项目已开源：
      <a href="https://github.com/mongoncn/dividend-site" target="_blank" style="margin:0 10px;">
        <i class="fab fa-github"></i> GitHub
      </a> |
      <a href="https://gitee.com/mongon/dividend-site" target="_blank" style="margin:0 10px;">
        <i class="fab fa-git-alt"></i> Gitee
      </a>
    </div>
    <div>© <a href="https://www.mongon.cn/" target="_blank" >茫跟的小屋</a></div>
  </footer>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { location.href = 'index.html'; }
  if (document.getElementById('username')) document.getElementById('username').textContent = user.username || '';

  function toggleMenu() {
    document.getElementById('navLinks').classList.toggle('active');
  }
  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    location.href = 'index.html';
  }

  const fmt = (n, d=2) => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});

  function renderReceived(list) {
    const box = document.getElementById('received');
    const sumEl = document.getElementById('recvsum');
    if (!list || !list.length) {
      box.innerHTML = '<div class="rili-empty">暂无已收记录</div>';
      sumEl.textContent = '';
      return;
    }
    const total = list.reduce((a, x) => a + Number(x.total_amount || 0), 0);
    sumEl.textContent = '累计 ' + fmt(total) + ' 元 · 共 ' + list.length + ' 笔';
    box.innerHTML = list.map(x => `<div class="cal-row recv">
      <div class="cal-date"><b>${String(x.dividend_date).slice(5,10)}</b><small>${String(x.dividend_date).slice(0,4)}</small></div>
      <div class="cal-name">${x.name}
        <small>每股派 ${Number(x.amount_per_share).toFixed(4)} 元 × ${x.quantity} 股</small></div>
      <div class="cal-amt"><b>${fmt(x.total_amount)}</b><small>已到账（元）</small></div>
    </div>`).join('');
  }

  async function load() {
    const box = document.getElementById('list');
    try {
      const r = await fetch('api/rili.php', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.status === 401) { location.href = 'index.html'; return; }
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      document.getElementById('asof').textContent = '数据时间 ' + d.as_of;
      renderReceived(d.received);
      if (!d.calendar || !d.calendar.length) {
        box.innerHTML = '<div class="rili-empty">暂无可推算的分红记录</div>';
        return;
      }
      box.innerHTML = d.calendar.map(c => {
        const soon = c.days >= 0 && c.days <= 14 ? ' soon' : '';
        const when = c.days >= 0 ? '还有 ' + c.days + ' 天' : '已过';
        return `<div class="cal-row${soon}">
          <div class="cal-date"><b>${c.date.slice(5)}</b><small>${when}</small></div>
          <div class="cal-name">${c.name}
            <small>每股派 ${c.cash_per_share} 元
              <span class="tag ${c.basis === '已公告' ? '' : 'est'}">${c.basis}</span></small></div>
          <div class="cal-amt"><b>${fmt(c.est_amount)}</b><small>预计到账（元）</small></div>
        </div>`;
      }).join('');
    } catch (e) {
      box.innerHTML = '<div class="rili-empty">加载失败：' + e.message + '</div>';
    }
  }
  load();
</script>
</body>
</html>
