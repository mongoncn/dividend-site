<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持仓分析 — 攒股收息</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <style>
    html{color-scheme:light}
    footer a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
    footer a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold)}
    body{background:#f8f9fb;color:#1a1d29}
    .an-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .an-head h2{margin:0;font-size:20px}
    .an-head span{font-size:12.5px;color:var(--text-muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
    .kpi{background:var(--bg-card);border:1px solid var(--border-color);
      border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
    .kpi .lab{font-size:11.5px;color:var(--text-secondary)}
    .kpi .val{font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
    .kpi .ex{font-size:11px;color:var(--text-muted);margin-top:2px}
    .an-sec{margin-bottom:24px}
    .an-sec h3{font-size:15px;margin:0 0 10px;padding-left:9px;border-left:3px solid var(--accent-gold);color:var(--text-primary)}
    table.an{width:100%;border-collapse:collapse;font-size:13px;
      background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden}
    table.an th{text-align:right;padding:9px 10px;font-weight:500;font-size:11.5px;
      background:var(--bg-primary);color:var(--text-muted);border-bottom:1px solid var(--border-color);white-space:nowrap}
    table.an th:nth-child(-n+2),table.an td:nth-child(-n+2){text-align:left}
    table.an td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(128,128,128,.12);
      font-variant-numeric:tabular-nums}
    table.an tr:last-child td{border-bottom:none}
    table.an td .cd{font-size:10.5px;color:var(--text-muted);margin-left:5px}
    .ind-row{display:flex;align-items:center;gap:12px;padding:5px 0}
    .ind-name{width:96px;text-align:right;font-size:12.5px;flex:none}
    .ind-track{flex:1;height:18px;background:rgba(128,128,128,.14);border-radius:4px;overflow:hidden}
    .ind-fill{height:100%;background:var(--accent-gold);border-radius:4px;opacity:.75}
    .ind-val{width:112px;text-align:right;font-size:12.5px;color:var(--text-muted);
      font-variant-numeric:tabular-nums;flex:none}
    .alert{display:flex;gap:9px;padding:9px 13px;border-radius:9px;margin-bottom:7px;font-size:13px}
    .alert.high{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.32);color:#b91c1c}
    .alert.mid{background:rgba(212,160,10,.1);border:1px solid rgba(212,160,10,.32);color:#8a6200}
    .alert.low{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.28);color:#1d4ed8}
    .dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:currentColor}
    .an-empty{padding:28px;text-align:center;color:var(--text-muted);font-size:13px}
    .an-note{font-size:12px;color:var(--text-muted);line-height:1.9;margin-top:12px}
    @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}
      table.an{font-size:12px}table.an th,table.an td{padding:7px 5px}.ind-name{width:64px}}
    /* 基准对比 */
    .bench{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
      background:var(--bg-card);border:1px solid var(--border-color);
      border-radius:var(--radius-md);padding:11px 16px;margin-bottom:18px;font-size:13px;
      box-shadow:var(--shadow-sm)}
    .b-item{display:flex;align-items:baseline;gap:6px}
    .b-lab{color:var(--text-muted);font-size:12px}
    .b-val{font-weight:600;font-variant-numeric:tabular-nums}
    .b-sep{width:1px;height:14px;background:var(--border-color)}
    .b-verdict{color:var(--text-secondary);font-size:12.5px;margin-left:auto}
    /* 收益曲线 */
    #curve{background:var(--bg-card);border:1px solid var(--border-color);
      border-radius:var(--radius-md);padding:14px 10px 8px;box-shadow:var(--shadow-sm)}
    #curve svg{display:block;width:100%;height:150px}
    .cv-empty{padding:26px;text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.8}
    /* M-2026 */

    @media (max-width:768px){
      .an-head h2{font-size:18px}
      .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
      .kpi{padding:12px 13px}
      .kpi .val{font-size:18px}
      .kpi .ex{font-size:10.5px}
      .ind-name{width:72px;font-size:11.5px}
      .ind-val{width:88px;font-size:11.5px}
      .an-sec h3{font-size:14px}
    }
    @media (max-width:600px){
      table.an{font-size:12px}
      table.an th,table.an td{padding:8px 5px}
      table.an th:nth-child(2),table.an td:nth-child(2),
      table.an th:nth-child(3),table.an td:nth-child(3),
      table.an th:nth-child(4),table.an td:nth-child(4){display:none}
    }
    @media (max-width:400px){
      .kpi .val{font-size:16px}
      .kpi{padding:10px 11px}
      table.an th:nth-child(5),table.an td:nth-child(5){display:none}
      .ind-val{width:72px}
    }

  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><i class="fas fa-chart-line"></i> 攒股收息</div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="菜单"><i class="fas fa-bars"></i></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> 仪表板</a></li>
      <li><a href="chicang.html"><i class="fas fa-chart-pie"></i> 持仓分析</a></li>
      <li><a href="chufa.html"><i class="fas fa-bell"></i> 触发价</a></li>
      <li><a href="rili.html"><i class="fas fa-calendar-check"></i> 分红日历</a></li>
      <li><a href="profile.html"><i class="fas fa-user"></i> 个人中心</a></li>
    </ul>
    <div class="user-info">
      <span id="username"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="退出登录">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="an-head">
      <h2><i class="fas fa-chart-pie"></i> 持仓分析</h2>
      <span id="asof"></span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="bench" id="bench"></div>

    <div class="an-sec">
      <h3>收益走势</h3>
      <div id="curve"><div class="cv-empty">加载中…</div></div>
    </div>

    <div class="an-sec">
      <h3>持仓明细</h3>
      <table class="an"><thead><tr>
        <th>标的</th><th>行业</th><th>股数</th><th>现价</th><th>市值</th>
        <th>占比</th><th>股息率</th><th>浮盈亏</th>
      </tr></thead><tbody id="plist"></tbody></table>
    </div>

    <div class="an-sec">
      <h3>行业分布</h3>
      <div id="industry"></div>
    </div>

    <div class="an-sec">
      <h3>风险提示</h3>
      <div id="alerts"></div>
    </div>

    <div class="an-note">
      持仓读每日简报同源配置；行情来自腾讯财经，行业来自东方财富。<br>
      股息率 = 最近 12 个月已实施每股分红 ÷ 现价；未计红利税，实际到手少 10%–20%。
    </div>
  </div>

  <footer style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">
    <div style="margin-bottom:10px;">本项目已开源：
      <a href="https://github.com/mongoncn/dividend-site" target="_blank" style="margin:0 10px;"><i class="fab fa-github"></i> GitHub</a> |
      <a href="https://gitee.com/mongon/dividend-site" target="_blank" style="margin:0 10px;"><i class="fab fa-git-alt"></i> Gitee</a>
    </div>
    <div>© <a href="https://www.mongon.cn/" target="_blank" >茫跟的小屋</a></div>
  </footer>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { location.href = 'index.html'; }
  document.getElementById('username').textContent = user.username || '';
  function toggleMenu(){ document.getElementById('navLinks').classList.toggle('active'); }
  function logout(){ localStorage.removeItem('token'); localStorage.removeItem('user'); location.href='index.html'; }

  const fmt = (n,d=0) => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
  const cls = n => n >= 0 ? 'up' : 'down';

  function renderBench(d){
    const s = d.summary || {}, bs = d.benchmarks || [];
    if (s.day_pct === undefined || s.day_pct === null) return;
    const combo = s.day_pct;
    let h = `<div class="b-item"><span class="b-lab">今日组合</span>
      <span class="b-val ${cls(combo)}">${combo>=0?'+':''}${fmt(combo,2)}%</span></div>`;
    for (const b of bs){
      h += `<div class="b-sep"></div><div class="b-item"><span class="b-lab">${b.name}</span>
        <span class="b-val ${cls(b.chg_pct)}">${b.chg_pct>=0?'+':''}${fmt(b.chg_pct,2)}%</span></div>`;
    }
    const zz = bs.find(x => x.name === '中证红利');
    if (zz){
      const diff = combo - zz.chg_pct;
      h += `<div class="b-verdict">${diff>=0?'跑赢':'跑输'}中证红利 ${fmt(Math.abs(diff),2)} 个百分点</div>`;
    }
    document.getElementById('bench').innerHTML = h;
  }

  function svgCurve(items){
    const W=640,H=150,PL=46,PR=12,PT=14,PB=24;
    const ps = items.map(x=>x.pct);
    let mn=Math.min(...ps,0), mx=Math.max(...ps,0);
    if (mx-mn < 1){ mn -= 0.5; mx += 0.5; }
    const span = mx-mn || 1;
    const X = i => PL + (W-PL-PR) * (items.length===1 ? .5 : i/(items.length-1));
    const Y = v => PT + (H-PT-PB) * (1-(v-mn)/span);
    const line = items.map((it,i)=>`${X(i).toFixed(1)},${Y(it.pct).toFixed(1)}`).join(' ');
    const y0 = Y(0);
    const area = `${PL},${y0} ` + line + ` ${X(items.length-1).toFixed(1)},${y0}`;
    const first = items[0], last = items[items.length-1];
    const lbl = items.length<=6 ? items : [first,null,last];
    let ticks = '';
    items.forEach((it,i)=>{
      const show = items.length<=6 || i===0 || i===items.length-1 || i%Math.ceil(items.length/4)===0;
      if(!show) return;
      ticks += `<circle cx="${X(i).toFixed(1)}" cy="${Y(it.pct).toFixed(1)}" r="2.4" fill="#d4a00a"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${PL}" y1="${y0.toFixed(1)}" x2="${W-PR}" y2="${y0.toFixed(1)}"
        stroke="#e5e7eb" stroke-dasharray="4 3"/>
      <polygon points="${area}" fill="rgba(212,160,10,.10)"/>
      <polyline points="${line}" fill="none" stroke="#d4a00a" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${ticks}
      <text x="${PL-6}" y="${(Y(mx)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${mx.toFixed(1)}%</text>
      <text x="${PL-6}" y="${(Y(mn)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${mn.toFixed(1)}%</text>
      <text x="${PL}" y="${H-6}" font-size="10" fill="#9ca3af">${first.date.slice(5)}</text>
      <text x="${W-PR}" y="${H-6}" text-anchor="end" font-size="10" fill="#9ca3af">${last.date.slice(5)}</text>
    </svg>
    <div style="text-align:right;font-size:11.5px;color:#9ca3af;padding:2px 6px 4px">
      共 ${items.length} 天 · 最新 ${last.pct>=0?'+':''}${last.pct.toFixed(2)}%</div>`;
  }

  async function loadCurve(){
    const box = document.getElementById('curve');
    try{
      const r = await fetch('api/snapshots.php', { headers:{'Authorization':'Bearer '+token} });
      if (r.status === 401) return;
      const d = await r.json();
      const items = d.items || [];
      if (items.length < 2){
        box.innerHTML = `<div class="cv-empty">已记录 ${items.length} 天，满 2 天后自动开始画曲线。<br>每天 08:40 记一次，先让它跑着。</div>`;
        return;
      }
      box.innerHTML = svgCurve(items);
    }catch(e){
      box.innerHTML = '<div class="cv-empty">曲线加载失败</div>';
    }
  }

  async function load(){
    try {
      const r = await fetch('api/chicang.php', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.status === 401) { location.href = 'index.html'; return; }
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      render(d);
      loadCurve();
    } catch(e){
      document.getElementById('asof').textContent = '加载失败：' + e.message;
    }
  }

  function render(d){
    document.getElementById('asof').textContent = '数据时间 ' + d.as_of;
    renderBench(d);
    const s = d.summary || {};
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="lab">持仓市值</div>
        <div class="val">${fmt(s.market_value)}</div><div class="ex">${s.count} 只标的</div></div>
      <div class="kpi"><div class="lab">浮盈亏</div>
        <div class="val ${cls(s.pnl)}">${s.pnl>=0?'+':''}${fmt(s.pnl)}</div>
        <div class="ex">成本 ${fmt(s.cost)}</div></div>
      <div class="kpi"><div class="lab">加权股息率</div>
        <div class="val">${s.weighted_dy}%</div><div class="ex">按市值加权</div></div>
      <div class="kpi"><div class="lab">近 12 个月分红</div>
        <div class="val">${fmt(s.cash_12m)}</div><div class="ex">税前估算</div></div>`;

    document.getElementById('plist').innerHTML = (d.positions||[]).map(p => `<tr>
      <td>${p.name}<span class="cd">${(p.code||'').slice(2)}</span></td>
      <td>${p.industry}</td><td>${fmt(p.qty)}</td>
      <td>${p.price} <span style="font-size:10.5px;opacity:.7">${p.chg_pct>=0?'+':''}${p.chg_pct}%</span></td>
      <td>${fmt(p.mv)}</td><td>${p.weight}%</td><td>${p.dy}%</td>
      <td class="${cls(p.pnl)}">${p.pnl>=0?'+':''}${fmt(p.pnl)}
        <span style="font-size:10.5px;display:block">${p.pnl_pct>=0?'+':''}${p.pnl_pct}%</span></td>
    </tr>`).join('') || '<tr><td colspan="8" class="an-empty">无持仓</td></tr>';

    const inds = d.industries || [];
    const maxW = Math.max(...inds.map(x => x.weight), 1);
    document.getElementById('industry').innerHTML = inds.map(x => `
      <div class="ind-row">
        <div class="ind-name">${x.name}</div>
        <div class="ind-track"><div class="ind-fill" style="width:${(x.weight/maxW*100).toFixed(1)}%"></div></div>
        <div class="ind-val">${x.weight}% · ${fmt(x.mv)}</div>
      </div>`).join('') || '<div class="an-empty">无数据</div>';

    const al = d.alerts || [];
    document.getElementById('alerts').innerHTML = al.length
      ? al.map(a => `<div class="alert ${a.level}"><span class="dot"></span><span>${a.text}</span></div>`).join('')
      : '<div class="an-empty">没有触发阈值</div>';
  }

  load();
</script>
</body>
</html>
