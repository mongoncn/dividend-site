<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>场外基金 — 攒股收息</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html{color-scheme:light}
    body{background:#f8f9fb;color:#1a1d29}
    .an-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .an-head h2{margin:0;font-size:20px;color:var(--text-primary)}
    .an-head span{font-size:12.5px;color:var(--text-muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
    .kpi{background:var(--bg-card);border:1px solid var(--border-color);
      border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
    .kpi .lab{font-size:11.5px;color:var(--text-secondary)}
    .kpi .val{font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
    .kpi .ex{font-size:11px;color:var(--text-muted);margin-top:2px}
    .an-sec{margin-bottom:24px}
    .an-sec h3{font-size:15px;margin:0 0 10px;padding-left:9px;border-left:3px solid var(--accent-gold);color:var(--text-primary)}
    table.fn{width:100%;border-collapse:collapse;font-size:13px;
      background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden}
    table.fn th{text-align:right;padding:9px 10px;font-weight:500;font-size:11.5px;
      background:var(--bg-primary);color:var(--text-muted);border-bottom:1px solid var(--border-color);white-space:nowrap}
    table.fn th:first-child,table.fn td:first-child{text-align:left}
    table.fn td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(128,128,128,.12);
      font-variant-numeric:tabular-nums;color:#2a2f38}
    table.fn tr:last-child td{border-bottom:none}
    table.fn tr:hover td{background:var(--bg-card-hover)}
    .fn-name b{font-size:13px;color:var(--text-primary)}
    .ch{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin:1px 3px 0 0;
      background:rgba(128,128,128,.14);color:var(--text-muted)}
    .up{color:#d92d20}.down{color:#1a7f4b}
    .an-empty{padding:28px;text-align:center;color:var(--text-muted);font-size:13px}
    .an-note{font-size:12px;color:var(--text-muted);line-height:1.9;margin-top:14px}
    footer{text-align:center;padding:18px 16px 24px;color:var(--text-muted);font-size:13px;line-height:1.8}
    footer a{color:inherit;text-decoration:none;transition:color .2s}
    footer a:hover{color:var(--accent-gold)}
    /* M-2026 */
    @media (max-width:768px){
      .an-head h2{font-size:18px}
      .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
      .kpi{padding:12px 13px}
      .kpi .val{font-size:18px}
      .an-sec h3{font-size:14px}
    }
    @media (max-width:600px){
      table.fn{font-size:12px}
      table.fn th,table.fn td{padding:8px 5px}
      table.fn th:nth-child(2),table.fn td:nth-child(2),
      table.fn th:nth-child(3),table.fn td:nth-child(3),
      table.fn th:nth-child(4),table.fn td:nth-child(4){display:none}
    }
    @media (max-width:400px){
      .kpi .val{font-size:16px}
      table.fn th:nth-child(5),table.fn td:nth-child(5){display:none}
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><i class="fas fa-chart-line"></i> 攒股收息</div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="菜单"><i class="fas fa-bars"></i></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> 仪表板</a></li>
      <li><a href="chicang.html"><i class="fas fa-chart-pie"></i> 持仓分析</a></li>
      <li><a href="chufa.html"><i class="fas fa-bell"></i> 触发价</a></li>
      <li><a href="rili.html"><i class="fas fa-calendar-check"></i> 分红日历</a></li>
      <li><a href="jijin.html" class="active"><i class="fas fa-coins"></i> 场外基金</a></li>
      <li><a href="profile.html"><i class="fas fa-user"></i> 个人中心</a></li>
    </ul>
    <div class="user-info">
      <span id="username"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="退出登录">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="an-head">
      <h2><i class="fas fa-coins"></i> 场外基金</h2>
      <span id="asof"></span>
    </div>

    <div class="kpis" id="kpis"><div class="kpi"><div class="val">加载中…</div></div></div>

    <div class="an-sec">
      <h3>持仓明细</h3>
      <div id="list"><div class="an-empty">加载中…（首次要拉 13 只净值，约 3-5 秒）</div></div>
    </div>

    <div class="an-note">
      净值来自天天基金，缓存 30 分钟；QDII 净值公布滞后 1 个交易日属正常。<br>
      同一代码多渠道自动合并（如摩根纳斯达克 100 的微众 / 同花顺两份），成本为合并口径。
    </div>
  </div>

  <footer>
    <div style="margin-bottom:6px;">本项目已开源：
      <a href="https://github.com/mongoncn/dividend-site" target="_blank" rel="noopener" style="margin:0 8px;">
        <i class="fab fa-github"></i> GitHub
      </a> |
      <a href="https://gitee.com/mongon/dividend-site" target="_blank" rel="noopener" style="margin:0 8px;">
        <i class="fab fa-git-alt"></i> Gitee
      </a>
    </div>
    <div>© <a href="https://www.mongon.cn/" target="_blank" rel="noopener">茫跟的小屋</a></div>
  </footer>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { location.href = 'index.html'; }
  if (document.getElementById('username')) document.getElementById('username').textContent = user.username || '';

  function toggleMenu(){ document.getElementById('navLinks').classList.toggle('active'); }
  function logout(){ localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = 'index.html'; }

  const fmt = (n, d=2) => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
  const cls = n => n >= 0 ? 'up' : 'down';
  const sign = n => (n >= 0 ? '+' : '') + fmt(n, d = 2);

  function render(d) {
    const s = d.summary || {};
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="lab">总市值</div><div class="val">${fmt(s.market_value)}</div>
        <div class="ex">共 ${s.count} 只（跨渠道已合并）</div></div>
      <div class="kpi"><div class="lab">总成本</div><div class="val">${fmt(s.cost)}</div>
        <div class="ex">含各渠道合并</div></div>
      <div class="kpi"><div class="lab">浮盈亏</div><div class="val ${cls(s.pnl)}">${sign(s.pnl)}</div>
        <div class="ex">不含已赎回部分</div></div>
      <div class="kpi"><div class="lab">收益率</div><div class="val ${cls(s.pnl)}">${sign(s.pnl_pct)}%</div>
        <div class="ex">盈亏 ÷ 成本</div></div>`;

    const rows = (d.items || []).map(x => {
      const navD = x.nav_date ? x.nav_date.slice(5) : '';
      return `<tr>
        <td class="fn-name"><b>${x.name}</b><br>
          <span class="ch">${(x.channels||[]).join('</span><span class="ch">')}</span></td>
        <td>${fmt(x.shares, 2)}</td>
        <td>${fmt(x.cost)}</td>
        <td>${x.nav === null ? '—' : fmt(x.nav, 4)}<br>
          <span style="font-size:10.5px;color:var(--text-muted)">${navD}</span></td>
        <td>${x.market_value === null ? '—' : fmt(x.market_value)}</td>
        <td class="${x.pnl === null ? '' : cls(x.pnl)}">
          ${x.pnl === null ? '—' : sign(x.pnl)}<br>
          <span style="font-size:10.5px">${x.pnl_pct === null ? '' : sign(x.pnl_pct) + '%'}</span></td>
      </tr>`;
    }).join('');

    document.getElementById('list').innerHTML =
      `<table class="fn"><thead><tr>
        <th>基金</th><th>份额</th><th>成本</th><th>净值</th><th>市值</th><th>浮盈亏</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  async function load() {
    try {
      const r = await fetch('api/funds.php', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.status === 401) { location.href = 'index.html'; return; }
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      document.getElementById('asof').textContent = '数据时间 ' + d.as_of;
      render(d);
    } catch (e) {
      document.getElementById('list').innerHTML =
        '<div class="an-empty">加载失败：' + e.message + '</div>';
      document.getElementById('kpis').innerHTML = '';
    }
  }
  load();
</script>
</body>
</html>
