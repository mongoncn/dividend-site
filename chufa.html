<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>触发价 — 攒股收息</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html{color-scheme:light}
    body{background:#f8f9fb;color:#1a1d29}
    .an-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .an-head h2{margin:0;font-size:20px;color:var(--text-primary)}
    .an-head span{font-size:12.5px;color:var(--text-muted)}
    .sum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
    .sum i{font-style:normal}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
      font-size:12.5px;border:1px solid var(--border-color);background:var(--bg-card)}
    .pill b{font-variant-numeric:tabular-nums}
    .pill.hit{border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.07);color:#b91c1c}
    .pill.near{border-color:rgba(212,160,10,.4);background:rgba(212,160,10,.07);color:#8a6200}
    .pill.safe{color:var(--text-secondary)}
    .sec{margin-bottom:26px}
    .sec h3{font-size:15px;margin:0 0 10px;padding-left:9px;border-left:3px solid var(--border-light);color:var(--text-primary)}
    .sec.hit h3{border-left-color:#e5484d}
    .sec.near h3{border-left-color:var(--accent-gold)}
    .trig{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:8px;
      background:var(--bg-card);border:1px solid var(--border-color);border-left:3px solid var(--border-light);
      border-radius:var(--radius-md);box-shadow:var(--shadow-sm);transition:var(--transition)}
    .trig:hover{background:var(--bg-card-hover)}
    .trig.hit{border-left-color:#e5484d;background:rgba(229,72,77,.035)}
    .trig.near{border-left-color:var(--accent-gold);background:rgba(212,160,10,.035)}
    .t-name{flex:1;min-width:0}
    .t-name b{font-size:14px;color:var(--text-primary)}
    .t-name small{display:block;color:var(--text-muted);font-size:11.5px;margin-top:3px;line-height:1.5}
    .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;
      background:rgba(128,128,128,.14);color:var(--text-muted);vertical-align:1px}
    .badge.hold{background:rgba(212,160,10,.14);color:#8a6200}
    .t-px{width:92px;flex:none;text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
    .t-px b{font-size:15px;color:var(--text-primary)}
    .t-px small{display:block;font-size:11px;color:var(--text-muted)}
    .t-gap{width:92px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;line-height:1.5}
    .t-gap em{font-style:normal;display:block;font-size:11px;color:var(--text-muted)}
    .up{color:#d92d20}.down{color:#1a7f4b}
    .hit-text{color:#b91c1c;font-weight:600}
    .near-text{color:#8a6200;font-weight:600}
    .an-empty{padding:28px;text-align:center;color:var(--text-muted);font-size:13px}
    .an-note{font-size:12px;color:var(--text-muted);line-height:1.9;margin-top:14px}
    footer{text-align:center;padding:18px 16px 24px;color:var(--text-muted);font-size:13px;line-height:1.8}
    footer a{color:inherit;text-decoration:none;transition:color .2s}
    footer a:hover{color:var(--accent-gold)}
    @media(max-width:640px){
      .trig{gap:9px;padding:11px 12px;flex-wrap:wrap}
      .t-px{width:76px}.t-gap{width:76px}
      .t-name{flex:1 1 100%;order:-1}
    }
    /* M-2026 */

    @media (max-width:768px){
      .an-head h2{font-size:18px}
      .sum{gap:7px}
      .pill{padding:4px 10px;font-size:11.5px}
      .sec h3{font-size:14px}
    }
    @media (max-width:420px){
      .t-px b{font-size:14px}
      .t-gap{font-size:11.5px}
    }

  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><i class="fas fa-chart-line"></i> 攒股收息</div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="菜单"><i class="fas fa-bars"></i></button>
    <ul class="nav-links" id="navLinks">
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> 仪表板</a></li>
      <li><a href="chicang.html"><i class="fas fa-chart-pie"></i> 持仓分析</a></li>
      <li><a href="chufa.html" class="active"><i class="fas fa-bell"></i> 触发价</a></li>
      <li><a href="funds.html"><i class="fas fa-layer-group"></i> 场外基金</a></li>
      <li><a href="rili.html"><i class="fas fa-calendar-check"></i> 分红日历</a></li>
      <li><a href="jijin.html"><i class="fas fa-coins"></i> 场外基金</a></li>
      <li><a href="profile.html"><i class="fas fa-user"></i> 个人中心</a></li>
    </ul>
    <div class="user-info">
      <span id="username"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="退出登录">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="an-head">
      <h2><i class="fas fa-bell"></i> 触发价</h2>
      <span id="asof"></span>
    </div>

    <div class="sum" id="sum"></div>
    <div id="list"><div class="an-empty">加载中…</div></div>

    <div class="an-note">
      数据来自实时行情，触发价读自持仓配置。<br>
      距触发 ≤3% 归为「接近」，仅供参考，不构成买卖指令。<br>
      本页只做提示，不下单、不推送。
    </div>
  </div>

  <footer>
    <div style="margin-bottom:6px;">本项目已开源：
      <a href="https://github.com/mongoncn/dividend-site" target="_blank" rel="noopener" style="margin:0 8px;">
        <i class="fab fa-github"></i> GitHub
      </a> |
      <a href="https://gitee.com/mongon/dividend-site" target="_blank" rel="noopener" style="margin:0 8px;">
        <i class="fab fa-git-alt"></i> Gitee
      </a>
    </div>
    <div>© <a href="https://www.mongon.cn/" target="_blank" rel="noopener">茫跟的小屋</a></div>
  </footer>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token) { location.href = 'index.html'; }
  if (document.getElementById('username')) document.getElementById('username').textContent = user.username || '';

  function toggleMenu(){ document.getElementById('navLinks').classList.toggle('active'); }
  function logout(){ localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = 'index.html'; }

  const fmt = (n, d=2) => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});

  function render(d) {
    const s = d.summary || {};
    document.getElementById('sum').innerHTML =
      `<span class="pill hit"><i class="fas fa-bolt"></i> 已触发 <b>${s.triggered||0}</b></span>` +
      `<span class="pill near"><i class="fas fa-hourglass-half"></i> 接近 <b>${s.near||0}</b></span>` +
      `<span class="pill safe"><i class="fas fa-shield-alt"></i> 安全 <b>${s.safe||0}</b></span>`;

    const groups = [
      { key:'triggered', cls:'hit',  title:'已触发' },
      { key:'near',      cls:'near', title:'接近触发（≤3%）' },
      { key:'safe',      cls:'',     title:'其余' },
    ];

    const box = document.getElementById('list');
    let html = '';
    for (const g of groups) {
      const rows = (d.items || []).filter(x => x.status === g.key);
      if (!rows.length) continue;
      html += `<div class="sec ${g.cls}"><h3>${g.title}</h3>` + rows.map(x => {
        const dirText = x.dir === 'below' ? '跌破' : '涨破';
        const chg = x.chg_pct === null || x.chg_pct === undefined ? '' :
          `<span class="${x.chg_pct >= 0 ? 'up' : 'down'}">${x.chg_pct >= 0 ? '+' : ''}${x.chg_pct.toFixed(2)}%</span>`;
        let gapMain, gapSub;
        if (x.gap_pct === null) {
          gapMain = '—'; gapSub = '无行情';
        } else if (x.status === 'triggered') {
          gapMain = `<span class="hit-text">已${dirText}</span>`;
          gapSub = Math.abs(x.gap_pct).toFixed(1) + '%';
        } else {
          gapMain = `<span class="${x.status==='near'?'near-text':''}">还差 ${Math.abs(x.gap_pct).toFixed(1)}%</span>`;
          gapSub = dirText + ' ' + fmt(x.target, 2);
        }
        const heldBadge = x.held ? '<span class="badge hold">持仓</span>' : '<span class="badge">观察</span>';
        return `<div class="trig ${x.status === 'triggered' ? 'hit' : (x.status === 'near' ? 'near' : '')}">
          <div class="t-name"><b>${x.name}</b>${heldBadge}
            <small>${x.action || ''}</small></div>
          <div class="t-px"><b>${x.price === null ? '—' : fmt(x.price, 2)}</b><small>${chg}</small></div>
          <div class="t-gap">${gapMain}<em>${gapSub}</em></div>
        </div>`;
      }).join('') + '</div>';
    }

    if (!html) {
      html = '<div class="an-empty">配置里没有触发价</div>';
    }
    box.innerHTML = html;
  }

  async function load() {
    try {
      const r = await fetch('api/chufa.php', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.status === 401) { location.href = 'index.html'; return; }
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      document.getElementById('asof').textContent = '数据时间 ' + d.as_of;
      render(d);
    } catch (e) {
      document.getElementById('list').innerHTML =
        '<div class="an-empty">加载失败：' + e.message + '</div>';
    }
  }
  load();
</script>
</body>
</html>
